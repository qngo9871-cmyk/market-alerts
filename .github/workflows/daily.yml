name: Daily market alerts
on:
  schedule:
    - cron: '30 21 * * 1-5'   # 21:30 UTC Mon-Fri = 07:30 Brisbane Tue-Sat, after each US close
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test email'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: daily-alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Run checks
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_CONFIG: ${{ secrets.ALERT_CONFIG }}
          FX_CONFIG: ${{ secrets.FX_CONFIG }}
        run: python alert.py ${{ inputs.test && '--test' || '' }}
      - name: Save alert state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
      - name: Email on failure
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python -c "import alert; alert.send('FAILED - daily market alerts', '<p>The daily market alert check failed. See the Actions log of qngo9871-cmyk/market-alerts.</p>')"
